# Reverse proxy for the Raspberry Pi deployment.
#
#   /api/*  -> backend container (Express on :5000)
#   /*      -> frontend container (nginx serving the built SPA on :80)
#
# Because the browser only ever talks to this one origin, the API calls are
# same-origin and CORS never applies.

# Map for the Connection header: keep-alive to the client, close to upstream.
# Without this, upgrading the client connection to HTTP/1.1 breaks keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Matches the 5MB limit in backend/src/interfaces/middlewares/uploadMiddleware.js.
    # nginx's default is 1MB, which would reject question-import uploads before
    # they ever reach Express.
    client_max_body_size 6M;

    # Do not advertise the nginx version.
    server_tokens off;

    # ---------- API ----------
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # AI generation can take 20s+ (the model reasons before answering), and
        # the backend itself allows up to 60s. nginx's default 60s read timeout
        # is too close to that, so give it headroom.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Never cache API responses.
        add_header Cache-Control "no-store" always;
    }

    # ---------- SPA ----------
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
