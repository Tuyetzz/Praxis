name: praxis

# Production stack for the Raspberry Pi (ARM64).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Shape:
#   nginx :80  ->  /api/*  -> backend:5000  (Express)
#              ->  /*      -> frontend:80   (static SPA)
#
# Only nginx publishes a port. mysql, redis, backend and frontend are reachable
# solely over the internal compose network, so nothing but the web server is
# exposed on the Pi's network.
#
# Everything runs on this one origin, so the browser never makes a cross-origin
# request and CORS does not come into play.
#
# Images: mysql:8.0, redis:7-alpine, nginx:1.27-alpine and node:20-alpine all
# publish arm64 variants, so no emulation is needed on a 64-bit Pi OS.
# NOTE: use the 64-bit Raspberry Pi OS - mysql:8.0 has no 32-bit image.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-examdb}
      # Must not be "root" - the entrypoint rejects that and crash-loops.
      MYSQL_USER: quizuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    # No ports: reachable only from other containers on this network.
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      # First boot initialises the data directory, which is slow on an SD card.
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist the cache across restarts. It is only a cache, so losing it is
    # harmless - but keeping it avoids a cold cache after every reboot.
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      # Override the host-development values from backend/.env: inside the
      # compose network "localhost" is the backend container itself.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: quizuser
      DB_PASS: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:-examdb}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Secrets come from the root .env so they are never written into a
      # tracked file. The .env file is gitignored.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      ACCESS_TOKEN_EXPIRES: ${ACCESS_TOKEN_EXPIRES:-12h}
      REFRESH_TOKEN_EXPIRES: ${REFRESH_TOKEN_EXPIRES:-7d}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?set SUPERADMIN_EMAIL in .env}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-chat}
      # Enable the cron job that auto-submits expired attempts.
      AUTO_SUBMIT_ENABLED: ${AUTO_SUBMIT_ENABLED:-true}
    # No ports: only nginx talks to it.
    command: sh -c "npm run seed:system && node src/server.js"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # seed:system runs first, and Sequelize syncs the schema on boot.
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Relative path: the browser calls the same origin and nginx proxies
        # /api to the backend. Change this only if the API lives elsewhere.
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    # No ports: nginx serves it.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    container_name: praxis_nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      # The only published port. Map "8080:80" instead if something else on the
      # Pi already owns port 80.
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
